<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bgax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f5"/><stop offset="100%" stop-color="#fbe3ec"/>
    </linearGradient>
  </defs>

  <!-- AX container -->
  <rect x="40" y="40" width="740" height="340" rx="16" fill="url(#bgax)" stroke="#e0608f" stroke-width="2.5"/>
  <text x="60" y="72" font-size="20" font-weight="700" fill="#c4356f">AX (Agentic System) = 목표를 스스로 나누고 실행하는 시스템</text>

  <!-- center agent -->
  <circle cx="410" cy="230" r="60" fill="#7b2ff7" stroke="#fff" stroke-width="3"/>
  <text x="410" y="225" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Agent</text>
  <text x="410" y="246" font-size="12" fill="#f3e8ff" text-anchor="middle">제어 루프</text>

  <!-- surrounding components -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <g>
      <rect x="120" y="120" width="150" height="56" rx="10" fill="#fff" stroke="#4285f4" stroke-width="2"/>
      <text x="195" y="148" fill="#1a56c4">LLM (두뇌)</text>
      <text x="195" y="166" font-size="11" font-weight="400" fill="#555">추론·판단·생성</text>
    </g>
    <g>
      <rect x="550" y="120" width="150" height="56" rx="10" fill="#fff" stroke="#1aa179" stroke-width="2"/>
      <text x="625" y="148" fill="#0f7a5a">Tools (손)</text>
      <text x="625" y="166" font-size="11" font-weight="400" fill="#555">API·검색·코드실행</text>
    </g>
    <g>
      <rect x="120" y="290" width="150" height="56" rx="10" fill="#fff" stroke="#f0a020" stroke-width="2"/>
      <text x="195" y="318" fill="#b9790f">Memory (기억)</text>
      <text x="195" y="336" font-size="11" font-weight="400" fill="#555">상태·맥락 유지</text>
    </g>
    <g>
      <rect x="550" y="290" width="150" height="56" rx="10" fill="#fff" stroke="#9b59b6" stroke-width="2"/>
      <text x="625" y="318" fill="#7d3c98">Planning (계획)</text>
      <text x="625" y="336" font-size="11" font-weight="400" fill="#555">목표 분해·재시도</text>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#888" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="270" y1="160" x2="360" y2="200"/>
    <line x1="550" y1="160" x2="470" y2="200"/>
    <line x1="270" y1="300" x2="360" y2="262"/>
    <line x1="550" y1="300" x2="470" y2="262"/>
  </g>

  <text x="60" y="372" font-size="11" fill="#888">하나의 Agent는 위 4요소를 루프로 묶는다. 이런 Agent가 여러 개 묶이면 AX(에이전트 시스템)가 된다.</text>
</svg>
