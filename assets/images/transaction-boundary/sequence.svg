<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 성공 뒤 주문 DB가 롤백되는 시간 순서</title>
  <desc id="desc">애플리케이션이 주문 PENDING을 DB 트랜잭션에 기록하고 예약 API가 성공한 뒤, 커밋 전 실패로 주문은 롤백된다. 예약 효과는 남는다.</desc>
  <rect width="1000" height="490" rx="20" fill="#0c1829"/>
  <g font-family="Arial, sans-serif">
    <text x="36" y="50" fill="#f4f8ff" font-size="25" font-weight="700">HTTP 성공 ≠ 주문 커밋</text>
    <text x="36" y="81" fill="#bdd0e3" font-size="16">하나의 @Transactional 메서드 안에 두 시스템을 놓은 경우</text>
    <g fill="#173755" stroke="#6bb9e6" stroke-width="2">
      <rect x="42" y="114" width="245" height="54" rx="12"/><rect x="377" y="114" width="245" height="54" rx="12"/><rect x="712" y="114" width="245" height="54" rx="12"/>
    </g>
    <g fill="#eaf5ff" font-size="20" font-weight="700" text-anchor="middle"><text x="164" y="148">애플리케이션</text><text x="500" y="148">주문 DB</text><text x="834" y="148">예약 API</text></g>
    <g stroke="#5f7893" stroke-width="2" stroke-dasharray="6 6"><path d="M164 168V440M500 168V440M834 168V440"/></g>
    <g stroke="#85cdf3" stroke-width="3" fill="none"><path d="M169 207H490"/><path d="M481 200l9 7-9 7"/><path d="M169 277H824"/><path d="M815 270l9 7-9 7"/><path d="M824 319H174"/><path d="M183 312l-9 7 9 7"/></g>
    <g fill="#d8eaff" font-size="16"><text x="310" y="199">1. PENDING INSERT (미커밋)</text><text x="403" y="267">2. HTTP 예약 요청</text><text x="456" y="309">3. 200 OK / 예약 반영</text></g>
    <path d="M169 388H490" stroke="#fa9c95" stroke-width="3"/><path d="M481 381l9 7-9 7" stroke="#fa9c95" stroke-width="3" fill="none"/>
    <text x="279" y="378" fill="#ffd1ca" font-size="16">4. 커밋 전 실패 → ROLLBACK</text>
    <rect x="51" y="416" width="583" height="43" rx="9" fill="#443039"/>
    <text x="69" y="444" fill="#ffded8" font-size="17" font-weight="700">DB: 주문 없음</text>
    <rect x="685" y="416" width="268" height="43" rx="9" fill="#23483f"/>
    <text x="704" y="444" fill="#d3ffed" font-size="17" font-weight="700">API: 예약 남음</text>
  </g>
</svg>
