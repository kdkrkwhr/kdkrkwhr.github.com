<svg xmlns="http://www.w3.org/2000/svg" width="420" height="820" viewBox="0 0 420 820" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 Spring 트랜잭션 전파 옵션 비교</title>
  <desc id="desc">REQUIRED, REQUIRES_NEW, NESTED가 각각 DB 물리 트랜잭션과 세이브포인트에 미치는 영향. HTTP 예약은 포함되지 않는다.</desc>
  <rect width="420" height="820" rx="20" fill="#0c1829"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="44" fill="#f4f8ff" font-size="21" font-weight="700">전파 옵션의 DB 경계</text>
    <text x="24" y="73" fill="#bdd0e3" font-size="15">바깥 → 안쪽 서비스 호출</text>
    <rect x="24" y="106" width="372" height="180" rx="13" fill="#173755" stroke="#6bb9e6" stroke-width="2"/>
    <text x="43" y="146" fill="#eff8ff" font-size="20" font-weight="700">REQUIRED</text>
    <text x="43" y="187" fill="#d7e8f5" font-size="16">물리 TX 하나를 함께 사용</text>
    <text x="43" y="221" fill="#d7e8f5" font-size="16">안쪽 rollback-only가 전체에 영향</text>
    <rect x="24" y="305" width="372" height="180" rx="13" fill="#224062" stroke="#85cdf3" stroke-width="2"/>
    <text x="43" y="345" fill="#eff8ff" font-size="20" font-weight="700">REQUIRES_NEW</text>
    <text x="43" y="386" fill="#d7e8f5" font-size="16">바깥 보류 · 안쪽 물리 TX 별도</text>
    <text x="43" y="420" fill="#d7e8f5" font-size="16">독립 커밋 · 연결 풀 여유 필요</text>
    <rect x="24" y="504" width="372" height="180" rx="13" fill="#224b43" stroke="#69ccb0" stroke-width="2"/>
    <text x="43" y="544" fill="#eff8ff" font-size="20" font-weight="700">NESTED</text>
    <text x="43" y="585" fill="#d7e8f5" font-size="16">물리 TX 하나 · 안쪽 savepoint</text>
    <text x="43" y="619" fill="#d7e8f5" font-size="16">JDBC 지원 여부 확인</text>
    <rect x="24" y="706" width="372" height="85" rx="13" fill="#443039"/>
    <text x="43" y="742" fill="#ffded8" font-size="17" font-weight="700">공통 한계</text>
    <text x="43" y="772" fill="#ffded8" font-size="15">HTTP 예약은 롤백되지 않습니다.</text>
  </g>
</svg>
